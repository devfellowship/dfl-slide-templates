name: Auto-merge new template

# WHY THIS WORKFLOW EXISTS
#   dfl-mcp-studio:src/lib/template-ref.ts resolves `main` to a commit SHA on a
#   5-minute TTL, automatically. There is no pin to bump, so a merged change is
#   servable within five minutes and this repository adds no latency at all. The
#   entire wait is the human merge, and this workflow removes it.
#   Plan: https://plans.devfellowship.com/20260822-branded-image-templates-deterministic-mcp (Phase 7, ADR-9, ADR-14)
#
# 🚦 THE POSTURE INVERTED ON 2026-08-27 (ADR-14).
#   The workflow file name still says "new template" — the workflow no longer
#   does. Renaming it would change the check-run name that `automerge-collect`
#   excludes from its own "is anything still running?" sweep, so the name stays
#   and this comment carries the truth. Tainan decided:
#
#     "It's ok to auto merge this here, why not?"   — Tainan, 2026-08-27
#
#   Auto-merge is now the NORM for this repository. `.github/automerge-rules.conf`
#   is a DENY-LIST plus safety invariants, not an allow-list with one hole.
#   To hold ONE pull request for review, label it `hold` — that is the
#   `no-hold-label` invariant, and the same label holds it against
#   `pr-merge-sweeper` too.
#
# WHERE THE RULES LIVE
#   `.github/automerge-rules.conf`. This workflow holds NO path knowledge. A
#   future exception is a line in that file, never a patch here.
#
# 🚨 THIS REPOSITORY IS PUBLIC, SO A FORK PR IS A STRANGER'S CODE.
#   Five deliberate choices follow from that:
#
#   1. The trigger is `pull_request`, NOT `pull_request_target` and NOT
#      `workflow_run`. Both of those run in the BASE context with a write token
#      on an event a stranger controls. `pull_request` from a fork gets a
#      READ-ONLY token from GitHub itself, so the platform is a second lock
#      behind the same-repo check below.
#   2. The checkout is the BASE branch, never the head. No head code is ever
#      executed in this job, and this job holds a write token. `npm ci` is never
#      run here either — a head lockfile must not choose what code runs.
#      The scripts are dependency-free node, on purpose.
#   3. The head side is read as DATA only: the changed-file list, the text of
#      registry.json at the head SHA, and the text of the new template's
#      config.yaml and sample.json at that same SHA. All of it is parsed as text
#      and JSON, never imported and never executed.
#   4. `same-repo-head` refuses any head outside this repository, compared as
#      full repo names.
#   5. `author-has-write` reads the collaborator-permission API. It is never
#      inferred from the author name, and never from `author_association`.
#
# 🚨 A GREEN `preview-regen` JOB IS NOT EVIDENCE THAT THE PREVIEW RASTERS MATCH.
#   Its "Check for preview drift" step emits `::warning::` and exits 0 on
#   purpose, because CI fonts and Chromium differ from a local render. So a
#   template whose PNG changed for a BAD reason still shows a green job. That is
#   plan risk 8 and Verification criterion 2, still open — and under ADR-14 it
#   costs more than it used to, because an EDIT to an existing template now
#   auto-merges and its raster can drift with every guard green. The fix is the
#   three-step sequence in criterion 2: vendor the sample images, build the
#   cross-engine diff, then flip the drift step to blocking.
#
# 🚨 THERE IS NO `|| true` IN THIS FILE, AND THERE MUST NEVER BE ONE.
#   Every refusal path ends in "no merge". A fact that cannot be read is a
#   refusal, not an allowance.

on:
  pull_request:
    # `unlabeled` is here because of `no-hold-label`: removing the `hold` label
    # is how an author releases a pull request for the unattended merge, and
    # without this type nothing would re-judge it until the next push.
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]

# Default deny; the one job below grants itself the minimum it needs.
permissions: {}

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # This exact name is excluded from the "is any check still running?" sweep,
    # so the gate does not wait for itself. Keep the two in step.
    name: Auto-merge gate
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # merge the pull request
      pull-requests: write # comment the refusal
      actions: read # read the CI run's jobs and their step conclusions
      checks: read # read every check run on the head SHA
    steps:
      # The BASE branch tip, not `base.sha`: the question `new-template-dir-only`
      # asks is "does this directory exist on main NOW?". A stale base.sha would
      # answer it against an older main.
      - name: Checkout base branch (never the head)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # BOOTSTRAP. The engine is read from the BASE branch, so on a pull request
      # opened BEFORE the engine reached `main` there is nothing to run. That is
      # a clean "no merge", not a failure: a red job on every unrelated pull
      # request would be noise, and the safe outcome is already the default.
      - name: Check that the gate engine exists on the base branch
        id: bootstrap
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          MISSING=""
          for f in .github/automerge-rules.conf \
                   .github/scripts/automerge-decide.mjs \
                   .github/scripts/automerge-decide.test.mjs \
                   .github/scripts/automerge-collect.mjs; do
            if [ ! -f "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -z "$MISSING" ]; then
            echo "engine_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine_present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Auto-merge gate"
              echo ""
              echo "**No merge.** The gate engine is not on \`$BASE_REF\` yet (missing:$MISSING)."
              echo ""
              echo "Nothing is merged and nothing is wrong. A human merges this pull request."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.bootstrap.outputs.engine_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same suite that runs in CI. If the gate's own rules do not hold, the gate
      # does not run — it refuses by failing, which merges nothing.
      - name: Self-test the rule engine
        if: steps.bootstrap.outputs.engine_present == 'true'
        run: node .github/scripts/automerge-decide.test.mjs

      - name: Decide
        id: gate
        if: steps.bootstrap.outputs.engine_present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          MAX_POLLS=60
          SLEEP_SECONDS=20

          for i in $(seq 1 "$MAX_POLLS"); do
            if ! node .github/scripts/automerge-collect.mjs \
                   --repo "$REPO" --pr "$PR" --base-checkout . \
                   --self-check-name "Auto-merge gate" > case.json; then
              echo "The collector could not read the facts. Refusing; nothing is merged."
              printf 'decision=BLOCK\nrule=collector-failed\n' >> "$GITHUB_OUTPUT"
              {
                echo "who=Tainan (@taigfs)"
                echo "reason=the gate could not read the pull request facts from the API, so the diff was never judged"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if node .github/scripts/automerge-decide.mjs case.json \
                 --conf .github/automerge-rules.conf > verdict.json; then
              echo "ALLOW on poll $i"
              break
            fi

            RETRYABLE="$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("verdict.json","utf8")).retryable === true))')"
            RULE="$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("verdict.json","utf8")).rule))')"
            echo "poll $i: BLOCK rule=$RULE retryable=$RETRYABLE"
            # `retryable` means only "this fact may still change while CI runs".
            # It never softens a refusal: every poll re-runs the full rule set.
            if [ "$RETRYABLE" != "true" ]; then
              break
            fi
            if [ "$i" -eq "$MAX_POLLS" ]; then
              echo "Guards did not finish within the polling budget. Refusing."
              break
            fi
            sleep "$SLEEP_SECONDS"
          done

          node -e '
            const v = JSON.parse(require("fs").readFileSync("verdict.json", "utf8"));
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            const one = (s) => String(s).replace(/[\r\n]+/g, " ");
            out.write(`decision=${one(v.decision)}\n`);
            out.write(`rule=${one(v.rule)}\n`);
            out.write(`who=${one(v.who)}\n`);
            out.write(`reason=${one(v.reason)}\n`);
            out.end();
          '
          {
            echo "### Auto-merge gate"
            echo ""
            node -e '
              const v = JSON.parse(require("fs").readFileSync("verdict.json", "utf8"));
              console.log(`**${v.decision}** — rule \`${v.rule}\``);
              console.log("");
              console.log(v.reason);
              console.log("");
              console.log(`Who decides instead: ${v.who}`);
            '
          } >> "$GITHUB_STEP_SUMMARY"

      # Squash-merge, pinned to the SHA the verdict was formed on. If the head
      # moved in the meantime the API answers 409 and nothing is merged; the next
      # `synchronize` event judges the new SHA from scratch.
      - name: Merge
        if: >-
          steps.bootstrap.outputs.engine_present == 'true' &&
          steps.gate.outputs.decision == 'ALLOW'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RULE: ${{ steps.gate.outputs.rule }}
          # Passed through the environment, never interpolated into the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          if gh api -X PUT "repos/$REPO/pulls/$PR/merge" \
               -f merge_method=squash \
               -f sha="$HEAD_SHA" \
               -f commit_title="$PR_TITLE (#$PR)" \
               -f commit_message="Auto-merged by the automerge gate (rule=$RULE): no changed path matches a human-gated glob, no path is removed or renamed, no hold label, and every blocking guard is green on $HEAD_SHA. Rule file: .github/automerge-rules.conf"; then
            echo "MERGED $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The merge call did not succeed, so nothing was merged. The head SHA probably moved; the next push is judged again." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A fork PR holds a READ-ONLY token, so it cannot comment. The refusal is
      # still recorded in the job summary above — the gate never merges silently
      # and never fails open.
      - name: Comment the refusal
        if: >-
          steps.bootstrap.outputs.engine_present == 'true' &&
          steps.gate.outputs.decision == 'BLOCK' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RULE: ${{ steps.gate.outputs.rule }}
          REASON: ${{ steps.gate.outputs.reason }}
          WHO: ${{ steps.gate.outputs.who }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          MARKER="<!-- automerge-gate:rule=$RULE -->"
          # One comment per rule per pull request. A repeated push does not repeat it.
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Already commented rule=$RULE on this pull request."
            exit 0
          fi
          CONF_URL="https://github.com/$REPO/blob/$BASE_REF/.github/automerge-rules.conf"
          {
            printf '%s\n\n' "$MARKER"
            printf '**This pull request will not auto-merge.** Rule `%s`.\n\n' "$RULE"
            printf '%s\n\n' "$REASON"
            printf '**Who merges it instead:** %s\n\n' "$WHO"
            printf 'The rule is data, not code: see [`.github/automerge-rules.conf`](%s).\n\n' "$CONF_URL"
            printf 'Auto-merge is the **norm** for this repository (plan ADR-14). That file is a **deny-list**: '
            printf 'the guard machinery (`scripts/**`, `package.json`, `package-lock.json`, `tsconfig.json`), the '
            printf 'gate itself (`.github/**`), the canvas contract, `studio/**`, `supabase/**`, `renovate.json` and '
            printf '`.gitignore` still need a human, because a green CI proves nothing about a change that alters '
            printf '**what CI runs** or reaches a consumer no job here watches.\n\n'
            printf 'To hold ONE pull request for review, label it `hold`.\n'
          } > comment.md
          jq -n --rawfile body comment.md '{body: $body}' \
            | gh api "repos/$REPO/issues/$PR/comments" --input -
