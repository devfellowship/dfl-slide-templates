id: title
name: Title Slide
version: "1.0.0"
category: content
# Design canvases this template ships. Absent = [landscape, portrait]
# (scripts/canvas.config.json defaultCanvases). social-portrait is 1080x1350
# (4:5, Instagram portrait) and is OPT-IN — plan ADR-8.
canvases: [landscape, portrait, social-portrait]
slots:
  - name: title
    type: text
    required: true
    description: "Main title text displayed prominently in the center"
    sample: "Welcome to the Platform"
  - name: subtitle
    type: text
    required: false
    description: "Optional subtitle text displayed below the main title"
    sample: "A modern foundation for your presentations"
