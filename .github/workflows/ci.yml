name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: development

jobs:
  lint-css:
    name: Lint CSS scoping
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run CSS lint
        run: npm run lint:css

  automerge-rules:
    name: Auto-merge rule engine
    # The merge gate's own regression suite. It runs on every pull request, not
    # only on one that touches the gate: the suite asserts against the REAL
    # registry.json and the REAL .github/automerge-rules.conf, so a template PR
    # that drifts them apart turns this job red. A merge rule with no test is
    # the failure mode — a loose path rule would let an unreviewed CSS change
    # reach every live deck.
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm ci`: the rule engine is dependency-free on purpose, so the gate
      # never runs third-party code to decide whether to merge.
      - name: Test the auto-merge rules
        run: npm run test:automerge

  registry-shape:
    name: Registry shape (cross-repo contract)
    # registry.json is READ by `dfl-mcp-studio:rank.ts`, which scores
    # `search_templates` on `name`, `when_to_use`, `media_profile`, `tags`,
    # `layout` and `category`; and it is WRITTEN by
    # `dfl-schema:supabase/functions/publish-template`, which edits it as TEXT
    # by offset. Nothing else in this repository reads that metadata, so a lost
    # `when_to_use` merges green and a user simply stops finding the template.
    # Plan Gap 4:
    # https://plans.devfellowship.com/20260822-branded-image-templates-deterministic-mcp
    #
    # THIS JOB REPLACES "Registry merge (write path)". That job ran the writer's
    # own suite from `supabase/functions/publish-template/`, source this
    # repository never deployed — the running copy has always been on the DFL
    # prod Supabase project, and only `dfl-schema:push-functions.yml` ships
    # there. The writer moved to `dfl-schema` (PR #889) with its suite. What
    # could not move is the half that asserts the LIVE document, because
    # `dfl-schema` can only test a vendored snapshot. This job is that half.
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm ci`: the check is dependency-free, the same posture as the merge
      # gate. A guard must not run third-party code to decide whether this
      # repository is well formed.
      - name: Check the registry shape
        run: npm run check:registry

  preview-regen:
    name: Canvas fill + previews
    runs-on: ubuntu-latest
    needs: lint-css
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Measures the real laid-out box of .tpl-root for every template in both
      # orientations. Catches canvas-fill regressions that the static rule in
      # lint-css.mjs cannot see (overrides behind :not(), transforms, ...).
      - name: Check canvas fill
        run: npm run check:canvas

      # Renders every template in EVERY theme declared by registry.json, both
      # orientations, over a deliberately hostile page colour, and reads back
      # computed styles. Catches the classes of bug the static rules cannot see:
      # a transparent .tpl-root that lets the host deck's own slide colour
      # through (how `table` shipped navy blue in a near-black deck), off-brand
      # type families arriving by inheritance, and — since 2026-08-12 — a theme
      # that leaves tokens undefined so every template falls back to the
      # DevFellowship literal and the deck renders in the wrong brand.
      - name: Check theme conformance (every template × every theme)
        run: npm run check:theme

      - name: Generate previews
        run: npm run preview

      - name: Check for preview drift
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet; then
            echo "::warning::Preview images differ from committed versions. CI-rendered previews can drift from local renders due to font/Chromium differences — download the 'regenerated-previews' artifact if you want to inspect or commit them."
            git diff --stat
          else
            echo "No preview drift detected."
          fi

      - name: Upload regenerated previews
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-previews
          path: templates/**/preview-*.png
          if-no-files-found: warn
          retention-days: 14