<div class="tpl-root tpl-video-fullscreen tpl-video-fullscreen--portrait {{^title}}tpl-video-fullscreen--bleed{{/title}}">
  {{#title}}<h1 class="tpl-video-fullscreen__title">{{title}}</h1>{{/title}}
  <div class="tpl-video-fullscreen__stage">
    <video class="tpl-video-fullscreen__footage" data-slide-video data-clip-seconds="{{clipSeconds}}" data-fit="{{fit}}" src="{{videoUrl}}" poster="{{posterUrl}}" muted playsinline preload="none" aria-label="{{title}}"></video>
  </div>
</div>
