id: reel-cover
name: Reel Cover
version: "1.0.0"
category: content
# A Reel cover is 9:16 and nothing else. It is not a deck slide, so it declares
# only the portrait canvas — landscape and social-portrait would be dead files.
canvases: [portrait]
slots:
  - name: headline
    type: text
    required: true
    description: "The payoff — the one line the cover exists to say. Two to five words per line reads best."
    sample: "Agora os 20% são o trabalho"
  - name: kicker
    type: text
    required: false
    description: "Optional short setup line above the headline. It is the half of the hook that makes the headline mean something."
    sample: "A IA entrega 80%."
  - name: handle
    type: text
    required: false
    description: "One small attribution mark, such as a social handle. It sits ABOVE the copy, like a byline, in muted ink at 19px — small enough that it cannot compete with the headline, large enough to survive the profile-grid downscale. Pass ONE mark. It is not the place for a name, a restated headline or a subtitle — a block of attribution lines is what this template exists to remove."
    sample: "@tainanfidelis"
  - name: emphasis
    type: select
    required: false
    options: ["accent", "ink"]
    description: "Which half of the copy carries the brand colour. 'accent' (the default) paints the headline in the brand colour and the kicker in secondary ink. 'ink' inverts it: the headline is ink, the kicker is the brand colour. Two covers that post within a few days of each other should not use the same value — a viewer reads a repeated colour block as a re-post."
    sample: "accent"
  - name: scale
    type: select
    required: false
    options: ["regular", "large"]
    description: "Headline size step. 'regular' (the default) is 96px and sets a two-line headline of 20 to 30 characters. 'large' is 132px, for a headline short enough to hold one line — under about 14 characters."
    sample: "regular"
  - name: photoUrl
    type: image
    required: false
    description: "Presenter portrait. A transparent-background PNG cut-out reads best. The template keeps it small and dark on purpose, so the headline stays the subject."
    sample: "https://placehold.co/800x800/0a0908/1f1c18?text=+"
  - name: photoAlt
    type: text
    required: false
    description: "Alt text for the presenter portrait"
    sample: "Presenter portrait"
