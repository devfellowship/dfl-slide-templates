<div class="tpl-root tpl-big-statement tpl-big-statement--social">
  <div class="tpl-big-statement__inner">
    {{#eyebrow}}<span class="tpl-big-statement__eyebrow">{{eyebrow}}</span>{{/eyebrow}}
    <p class="tpl-big-statement__statement">{{statement}}</p>
    {{#items}}
    <p class="tpl-big-statement__line" data-anim-target="step" data-anim-index="{{anim_index}}">{{text}}</p>
    {{/items}}
  </div>
</div>
