id: outro
name: Outro
version: "1.0.0"
category: layout
# Design canvases this template ships. Absent = [landscape, portrait]
# (scripts/canvas.config.json defaultCanvases). social-portrait is 1080x1350
# (4:5, Instagram portrait) and is OPT-IN — plan ADR-8.
canvases: [landscape, portrait, social-portrait]
slots:
  # NAMED for the `highlight` animation preset, which reads a `definition` or a
  # `highlight` slot. The outro's motion reuses that preset, and the Studio
  # decides a preset can drive a template by looking for one of those names — so
  # a slot called `cta` would make the editor warn that this slide has nothing
  # to animate while it animated perfectly well.
  - name: highlight
    type: text
    required: false
    description: "Small mono uppercase call-to-action under the hairline — usually a URL or handle. Omit for a wordmark-only end card."
    sample: "devfellowship.com"
