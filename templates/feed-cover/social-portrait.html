<div class="tpl-root tpl-feed-cover tpl-feed-cover--social tpl-feed-cover--scale-{{scale}}">
  <span class="tpl-feed-cover__rule"></span>
  <div class="tpl-feed-cover__main">
    {{#imageUrl}}<img class="tpl-feed-cover__image" src="{{imageUrl}}" alt="{{imageAlt}}" />{{/imageUrl}}
    {{#kicker}}<span class="tpl-feed-cover__kicker">{{kicker}}</span>{{/kicker}}
    <h1 class="tpl-feed-cover__headline">{{headline}}</h1>
  </div>
  <div class="tpl-feed-cover__foot">{{#handle}}<span class="tpl-feed-cover__handle">{{handle}}</span>{{/handle}}{{#swipe}}<span class="tpl-feed-cover__swipe">{{swipe}}</span>{{/swipe}}</div>
</div>
