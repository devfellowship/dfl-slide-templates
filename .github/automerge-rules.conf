# automerge-rules.conf — which PRs on this repo may merge with no human, and why.
#
# WHAT THIS IS
#   `dfl-mcp-studio:src/lib/template-ref.ts` resolves `main` to a commit SHA on a
#   5-minute TTL, automatically. Nobody bumps a pin. So a merged template is
#   servable within five minutes and the repository adds no latency at all: the
#   whole wait for a new template is the human merge. This file removes that wait
#   for the ONE case where it is safe — a brand-new template directory, which
#   cannot break a deck that already exists — and keeps the human gate on every
#   change that reaches a live deck.
#
# WHY IT IS DATA AND NOT AN `if`
#   Same reason as `skills/safe-admin-merge/protected_paths.conf`, which this
#   file copies: the next exception should cost one line here, not a patch to the
#   workflow. `.github/workflows/automerge-new-template.yml` reads this file and
#   holds no path knowledge of its own.
#
# FORMAT — four `|`-separated fields, one rule per line:
#
#   <decision>|<glob or invariant name>|<who decides instead>|<why>
#
#   decision  `human`     — a changed path matching this glob refuses the merge,
#                           always. Evaluated FIRST and it wins over `automerge`.
#             `automerge` — a changed path matching this glob is ALLOWED to be in
#                           an auto-merged diff. It does not by itself authorise
#                           the merge; every invariant below must hold too.
#             `invariant` — a named structural rule that no glob can express.
#                           The field-2 name must be one the decider implements.
#   glob      matched against every changed file path in the PR, relative to the
#             repo root. `*` matches within one path segment, `**` crosses `/`,
#             `?` matches one non-`/` character. Everything else is literal.
#             Same matcher as protected_paths.conf, on purpose.
#   who       free text, shown in the refusal comment. Name the human.
#   why       free text, shown in the refusal comment. One sentence, concrete.
#
#   Blank lines and `#` comments are ignored.
#
# DEFAULT IS DENY. A changed path that matches NO `automerge` glob refuses the
# merge (`rule=unlisted-path`). A new file shape is therefore human-gated until
# somebody adds a line here. There is no catch-all glob and there must never be
# one.
#
# THERE IS NO OVERRIDE FLAG, on purpose. Same posture as protected_paths.conf.
# If a refused PR must land, the named human merges it.
#
# FAIL-CLOSED IN BOTH DIRECTIONS. The decider refuses if this file is missing,
# unparseable, lists an invariant it does not implement (`conf-unknown-invariant`)
# or OMITS one it does implement (`conf-incomplete`). Deleting an `invariant` line
# to relax the gate does not relax it — it breaks it. That is the point: a gate
# that opens when it cannot see is not a gate.
#
# THE BLAST RADIUS IF THE PATH RULE IS LOOSE (plan risk 10)
#   `dfl-lesson-studio` and the studio MCP serve this registry live. A rule that
#   also matched an EXISTING `templates/<id>/**` directory would let an unreviewed
#   CSS change reach every live deck that uses that template. That is why
#   `new-template-dir-only` exists and why the `templates/*/**` line below is
#   `automerge` only in company with it.

# ---------------------------------------------------------------------------
# human — refused always, no exceptions. Listed before the automerge globs
# because `human` wins; `templates/*/**` below must never be read as covering
# an existing directory.
# ---------------------------------------------------------------------------
human|themes/**|Tainan (@taigfs)|a theme file restyles every one of the 46 templates at once, so one bad merge changes every live deck in every brand
human|scripts/**|Tainan (@taigfs)|scripts/ is the determinism machinery (lint-css, check-canvas, check-theme, preview-gen); merging a change here changes what the guards themselves accept
human|canvas.config.json|Tainan (@taigfs)|the canvas is a cross-repo contract shared with dfl-lesson-studio and dfl-render, so a change here desynchronises three repos
human|scripts/canvas.config.json|Tainan (@taigfs)|the canvas contract's real path today; listed explicitly so a future move of the file cannot silently unguard it
human|.github/**|Tainan (@taigfs)|this is the merge gate itself, including this rule file and the workflow that reads it; a PR that edits the gate must pass through the gate it replaces
human|package.json|Tainan (@taigfs)|a dependency or script change alters what every guard runs
human|package-lock.json|Tainan (@taigfs)|a lockfile change alters what every guard runs
human|studio/**|Tainan (@taigfs)|the studio app is deployed code, not a template
human|supabase/**|Tainan (@taigfs)|database and edge-function code, guarded by the dfl-schema flow
human|README.md|Tainan (@taigfs)|documentation states the contract; an unreviewed edit makes the docs and the code disagree
human|showcase.html|Tainan (@taigfs)|a generated artefact; an unreviewed hand-edit desynchronises it from showcase-gen.ts
human|tsconfig.json|Tainan (@taigfs)|changes how every guard compiles
human|renovate.json|Tainan (@taigfs)|changes what lands in this repo unattended
human|.gitignore|Tainan (@taigfs)|can hide a file from review

# ---------------------------------------------------------------------------
# automerge — the only two path shapes an unattended merge may contain.
# ---------------------------------------------------------------------------
automerge|templates/*/**|Tainan (@taigfs) for any EXISTING template|allowed only for a directory that does not exist on main (invariant new-template-dir-only); a new directory breaks no deck that exists, an edit to an existing one breaks every deck that uses it
automerge|registry.json|Tainan (@taigfs) for any other registry edit|allowed only when the diff appends exactly one entry, for this same new template, and leaves every pre-existing entry and every other key byte-identical (invariant registry-single-append)

# ---------------------------------------------------------------------------
# invariant — the rules a glob cannot express. Every one of these must be
# listed here or the decider refuses (`conf-incomplete`).
# ---------------------------------------------------------------------------
invariant|same-repo-head|nobody — a fork PR never auto-merges|this repo is PUBLIC, so a fork PR is a stranger's code; head.repo.full_name must equal the repository
invariant|author-has-write|Tainan (@taigfs)|the author must have write/maintain/admin permission, read from the collaborator-permission API and never inferred from the author name or from author_association
invariant|not-draft|the author, by marking the PR ready|a draft PR is unfinished by declaration and CI is not the author's signal to merge
invariant|no-deletions|Tainan (@taigfs)|a deletion or a rename removes a path that something live may read; adding a new template never needs one
invariant|new-template-dir-only|Tainan (@taigfs)|every changed templates/ path must sit under exactly ONE template id, that id must not exist on the base commit, and every one of its files must be status=added
invariant|registry-single-append|Tainan (@taigfs)|registry.json must gain exactly one templates[] entry, at the END of the array, whose id equals the new template id, with every pre-existing entry and every other top-level key unchanged
invariant|guards-green|Tainan (@taigfs)|the three blocking guards must be green ON THE HEAD SHA: the lint-css job, and the check:canvas and check:theme STEPS inside the preview-regen job, each asserted present and successful; plus no other check run on that SHA may be failing or still running
