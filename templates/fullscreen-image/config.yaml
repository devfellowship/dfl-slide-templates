id: fullscreen-image
name: Full-screen Image
version: "1.0.0"
category: media
# Design canvases this template ships. Absent = [landscape, portrait]
# (scripts/canvas.config.json defaultCanvases). social-portrait is 1080x1350
# (4:5, Instagram portrait) and is OPT-IN — plan ADR-8.
canvases: [landscape, portrait, social-portrait]
slots:
  - name: imageUrl
    type: image
    required: true
    description: "URL of the image to display full-screen (fills the entire slide)"
    sample: "https://placehold.co/1920x1080/0A0908/E07A4A?text=Full-screen+Image"
  - name: fit
    type: select
    required: false
    description: "How the image fills the slide: 'cover' (fill, may crop edges — good for photos/backgrounds) or 'contain' (whole image visible, letterboxed with bg color — good for pre-made slides/diagrams)"
    options: ["cover", "contain"]
    sample: "cover"
  - name: bg
    type: text
    required: false
    description: "Letterbox/background color shown around the image in 'contain' mode (hex). Omit it and the letterbox follows the active theme page surface (--s-surface-page); pass a hex only to override the theme deliberately."
    sample: "#0A0908"
  - name: imageAlt
    type: text
    required: false
    description: "Accessible alt text for the image"
    sample: "Slide image"
