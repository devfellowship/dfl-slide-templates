# automerge-rules.conf — which PRs on this repo may merge with no human, and why.
#
# WHAT THIS IS
#   `dfl-mcp-studio:src/lib/template-ref.ts` resolves `main` to a commit SHA on a
#   5-minute TTL, automatically. Nobody bumps a pin. So a merged change is
#   servable within five minutes and the repository adds no latency at all: the
#   whole wait is the human merge. This file says which merges need no human.
#
# 🚦 THE POSTURE INVERTED ON 2026-08-27 (ADR-14). READ THIS BEFORE EDITING.
#   Until 2026-08-27 this file was DEFAULT-DENY with one narrow hole: a brand-new
#   `templates/<new-id>/**` directory. Everything else was `human`. Tainan
#   decided the opposite:
#
#     "It's ok to auto merge this here, why not?"   — Tainan, 2026-08-27
#
#   Auto-merge is now the NORM for this repository, and this file is a DENY-LIST
#   plus a set of safety invariants. Plan ADR-14:
#   https://plans.devfellowship.com/20260822-branded-image-templates-deterministic-mcp
#
#   WHY IT IS SAFE HERE AND NOT EVERYWHERE. This repo's CI is the strongest in
#   the fleet for the risk in question. `lint:css`, `check:canvas` and
#   `check:theme` are all BLOCKING, and `check:theme` renders EVERY template
#   against EVERY theme in both orientations — 404 renders today — over a
#   hostile magenta page, then reads back computed styles. A theme change that
#   breaks a template goes red before it can merge. That is the evidence the
#   decision rests on, not a preference.
#
#   WHY THE OLD RULES HAD TO GO, rather than being left in place. They declared
#   `themes/**`, `README.md` and more human-gated, and `pr-merge-sweeper` —
#   which reads `skills/safe-admin-merge/protected_paths.conf`, where this repo
#   has no entry — merged CI-green claude-main PRs anyway, every ~3 minutes.
#   Measured 2026-08-26: this gate refused PR #86 with `rule=human-gated-path`
#   and the sweeper merged it six minutes later. A rule nobody enforces is worse
#   than no rule: it reads as protection that is not there.
#
#   ⚠️ AND THAT IS STILL PARTLY TRUE OF THE `human|` LINES BELOW. The sweeper
#   does not read this file, so for a claude-main-authored PR these lines are
#   enforced by THIS gate only — the sweeper can still land one. They are a real
#   brake for every other author, and they stop THIS gate from merging the
#   guard machinery unattended. They are not a fleet-wide guarantee. Making them
#   one needs either a `protected_paths.conf` entry (ADR-14 declined that) or
#   teaching the sweeper to read each repo's own conf (ADR-14 option C).
#   Do not describe them as enforced without that qualifier.
#
# WHY IT IS DATA AND NOT AN `if`
#   Same reason as `skills/safe-admin-merge/protected_paths.conf`, which this
#   file copies: the next exception should cost one line here, not a patch to the
#   workflow. `.github/workflows/automerge-new-template.yml` reads this file and
#   holds no path knowledge of its own.
#
# FORMAT — four `|`-separated fields, one rule per line:
#
#   <decision>|<glob or invariant name>|<who decides instead>|<why>
#
#   decision  `guard`     — a CI job, or one named STEP inside a job, that must be
#                           green ON THE HEAD SHA. Field 2 is the job's display
#                           name; field 3 is the step's display name, or `-` for
#                           the whole job. These are display names as GitHub
#                           reports them, so a renamed step is a ONE-LINE change
#                           here — never a patch to the workflow. An unresolved
#                           guard fails closed: absent is not passing.
#             `human`     — a changed path matching this glob refuses the merge,
#                           always. Evaluated FIRST and it wins over `automerge`.
#                           This is the DENY-LIST, and it is now load-bearing.
#             `automerge` — a changed path matching this glob is ALLOWED to be in
#                           an auto-merged diff. It does not by itself authorise
#                           the merge; every invariant below must hold too.
#             `invariant` — a named structural rule that no glob can express.
#                           The field-2 name must be one the decider implements.
#   glob      matched against every changed file path in the PR, relative to the
#             repo root. `*` matches within one path segment, `**` crosses `/`,
#             `?` matches one non-`/` character. Everything else is literal.
#             Same matcher as protected_paths.conf, on purpose.
#   who       free text, shown in the refusal comment. Name the human. On a
#             `guard` line this field is the STEP name instead, or `-`.
#   why       free text, shown in the refusal comment. One sentence, concrete.
#
#   Blank lines and `#` comments are ignored.
#
# THE DEFAULT IS NOW ALLOW, and one line makes it so: `automerge|**`. A path
# that matches no `human` glob may be in an auto-merged diff. The decider still
# implements the old default-deny refusal (`rule=unlisted-path`) and it still
# fires the moment somebody narrows that catch-all, so narrowing this file is a
# safe operation. Widening it is the one that needs an argument.
#
# THERE IS NO OVERRIDE FLAG, on purpose. Same posture as protected_paths.conf.
# If a refused PR must land, the named human merges it.
#
# HOW TO HOLD ONE PULL REQUEST FOR REVIEW: put a `hold` label on it. That is the
# `no-hold-label` invariant, and it is the review mechanism ADR-14 leaves in
# place now that the path list no longer supplies one. The label set is the same
# one `pr-merge-sweeper` honours — `hold`, `do-not-merge`, `do_not_merge`,
# `hold-for-review`, `no-merge`, `wip` — so ONE label holds a PR against both
# this gate and the sweeper.
#
# FAIL-CLOSED IN BOTH DIRECTIONS. The decider refuses if this file is missing,
# unparseable, lists an invariant it does not implement (`conf-unknown-invariant`)
# or OMITS one it does implement (`conf-incomplete`). Deleting an `invariant` line
# to relax the gate does not relax it — it breaks it. That is the point: a gate
# that opens when it cannot see is not a gate.
#
# ---------------------------------------------------------------------------
# TWO CHANGE CLASSES, AND WHY THREE INVARIANTS ARE CONDITIONAL
# ---------------------------------------------------------------------------
#   The decider classifies every diff before it judges it:
#
#     new-template — at least one changed path sits under `templates/<id>/`
#                    where `<id>` does NOT exist on the base commit.
#     change       — everything else: a CSS fix to an existing template, a theme
#                    edit, a README edit, a new top-level file.
#
#   `new-template-dir-only`, `registry-single-append` and
#   `non-empty-sample-source` apply to the `new-template` class ONLY. They were
#   never review requirements — they were the SCOPE of the old narrow hole, plus
#   the structural rules that make a brand-new template well-formed. ADR-14
#   widened the scope, so confining auto-merge to a new directory is now too
#   tight; but a half-formed template or a registry rewrite must still not land,
#   so the three keep doing their real job wherever a new template appears.
#
#   The condition is part of each invariant's MEANING, which is why it is not a
#   fifth conf field: "if this diff introduces a new template directory, then …".
#   A conditional invariant is still an invariant. The decider names the class in
#   every verdict and says explicitly which invariants were `n/a`, so a skip is
#   never mistaken for a pass.
#
#   🚨 THE MIXED DIFF STILL BLOCKS, AND THAT IS DELIBERATE. A PR that adds a new
#   template AND edits an existing one is in the `new-template` class, so
#   `new-template-dir-only` refuses it: exactly one template directory, and it
#   must be the new one. Without that, a new template could dodge
#   `registry-single-append` and `non-empty-sample-source` simply by touching a
#   second template in the same PR. Split the PR.
#
# WHY A NEW TEMPLATE MUST SHIP SAMPLE DATA (invariant non-empty-sample-source)
#   Sample data used to live in `scripts/sample-data.ts`, which is human-gated.
#   A template that auto-merged therefore arrived with NO sample data: Mustache
#   filled every slot with the empty string, the committed preview was blank, and
#   `check:canvas` / `check:theme` passed against an empty layout — green, and
#   proving nothing about a populated render. A BLANK TEMPLATE MERGING GREEN IS
#   WORSE THAN ONE THAT IS BLOCKED. Sample data now lives at
#   `templates/<id>/sample.json`, inside this same auto-mergeable directory, so a
#   new template ships its own sample data and KEEPS the unattended merge. The
#   invariant is what makes that a rule instead of a habit.
#
#   The precedence mirrors `scripts/render-page.ts:resolveSampleData()` and must
#   keep mirroring it: a PRESENT `sample.json` is the whole answer at render
#   time, never merged with `config.yaml`. So an EMPTY `sample.json` blanks the
#   render even when every slot carries a `sample:`, and the gate refuses it.
#
#   ONE EXEMPTION, deliberate: a `config.yaml` whose `slots:` is empty declares
#   nothing to fill, so it needs no sample. That is `templates/blank/` on main,
#   which ships no `sample.json` for exactly this reason.
#
# WHY registry.json MAY NOW BE EDITED, AND WHAT STILL GUARDS IT
#   `registry.json` is served live by the studio MCP and by dfl-lesson-studio.
#   CI already asserts the parts that break a render: `check:theme` fails if
#   `templates/` and `registry.json` disagree about which templates exist, and
#   `lint:css` fails if `registry.json` and `scripts/theme.config.json` disagree
#   about which themes exist. What CI does NOT see is the DISCOVERABILITY
#   metadata — `when_to_use`, `avoid_when`, `tags`. Every guard stays green while
#   `search_templates` silently stops ranking a template for its own phrase.
#   That is plan Gap 4, and `update_template` does it TODAY (plan risk 6). So
#   `registry-no-metadata-loss` refuses any diff that drops an entry, drops an
#   entry's key, or drops a top-level key. It is a safety invariant, not a review
#   requirement: it is deterministic, it costs no latency, and it catches the one
#   registry failure four green guards cannot.
#
# ⚠️ WHAT NOBODY GUARDS, NOW THAT `themes/**` AUTO-MERGES
#   Verification criterion 5 of the plan — "the theme matches its brand guide" —
#   has NO tool. `lint:css` bans four specific hexes per theme and asserts token
#   completeness; nothing diffs a theme against `brand.devfellowship.com`. So a
#   theme change that is token-complete, renders green in 404 renders, and paints
#   an OFF-BRAND colour now merges unattended. That is the honest, accepted cost
#   of ADR-14. The fix is the criterion-5 checker, already a named drift signal
#   in the plan — not a human gate that the sweeper bypasses anyway.
#
# ⚠️ AND `showcase.html` HAS NO GUARD AT ALL. `npm run showcase` does not run in
#   CI, the file on `main` is already stale, and nothing diffs it against
#   `showcase-gen.ts`. It used to be human-gated; the gate protected nothing,
#   because the staleness arrives through a merge that regenerates nothing. The
#   real fix is a CI drift check on the generated artefact.

# ---------------------------------------------------------------------------
# human — refused always, no exceptions. Listed before the automerge globs
# because `human` wins. This is the DENY-LIST and it is what makes the
# catch-all below safe: everything here is a path where a green CI proves
# nothing, because the change alters WHAT CI RUNS or reaches a live consumer
# no guard in this repo watches.
# ---------------------------------------------------------------------------
human|scripts/**|Tainan (@taigfs)|scripts/ IS the determinism machinery (lint-css, check-canvas, check-theme, render-page, preview-gen); the guards run the HEAD copy, so a PR that weakens a guard turns that guard green and CI structurally cannot catch it
human|.github/**|Tainan (@taigfs)|this is the merge gate itself, including this rule file and the workflow that reads it; the gate judges a PR with the BASE copy of these files, so a weakened head conf would be applied unattended to the NEXT PR
human|package.json|Tainan (@taigfs)|it defines what every guard command actually runs, so a redefined npm script makes every guard green while checking nothing
human|package-lock.json|Tainan (@taigfs)|it chooses the code the guards execute, so a lockfile change is a supply-chain change to the guards themselves
human|tsconfig.json|Tainan (@taigfs)|it changes how the ts-node guards compile, so a looser setting can silently disable a check rather than fail it
human|canvas.config.json|Tainan (@taigfs)|the canvas is a cross-repo contract shared with dfl-lesson-studio and dfl-render, and the counterpart check that catches a desync lives in the OTHER repo, so merging here turns a different repo red with nobody watching
human|scripts/canvas.config.json|Tainan (@taigfs)|the canvas contract's real path today; listed explicitly so a future move of the file cannot silently unguard it
human|studio/**|Tainan (@taigfs)|the studio app is deployed code with no test suite — Studio CI proves lint, typecheck and build only, so a working build can still ship a broken screen to a user
human|supabase/**|Tainan (@taigfs)|the publish-template edge function is the write path INTO this repository and no job in this repo tests it; edge functions follow the dfl-schema human-gated flow
human|renovate.json|Tainan (@taigfs)|it configures what lands in this repo unattended, so auto-merging a change to it is the same self-reference as auto-merging the gate
human|.gitignore|Tainan (@taigfs)|it can hide a file from the diff, and a path that never appears in the diff is judged by no rule in this file

# ---------------------------------------------------------------------------
# automerge — ONE catch-all. ADR-14 made auto-merge the norm for this repo, so
# the specificity lives in the deny-list above rather than in an allow-list that
# has to be extended for every new file shape. Redundant named globs were
# deliberately NOT kept: an allow line whose `why` no rule reads is the same
# decorative declaration ADR-14 removed.
# ---------------------------------------------------------------------------
automerge|**|Tainan (@taigfs) for anything on the human list above|ADR-14: auto-merge is the norm for this repo because lint:css, check:canvas and check:theme are all blocking and check:theme renders every template against every theme over a hostile page colour; a change that breaks a render goes red before it can merge

# ---------------------------------------------------------------------------
# invariant — the rules a glob cannot express. Every one of these must be
# listed here or the decider refuses (`conf-incomplete`). NONE of them is a
# review requirement; every one is a safety property.
#
# The first five apply to EVERY diff. The three marked `new-template only`
# apply when, and only when, the diff introduces a template directory that does
# not exist on the base commit — see "TWO CHANGE CLASSES" above.
# ---------------------------------------------------------------------------
invariant|same-repo-head|nobody — a fork PR never auto-merges|this repo is PUBLIC, so a fork PR is a stranger's code; head.repo.full_name must equal the repository
invariant|author-has-write|Tainan (@taigfs)|the author must have write/maintain/admin permission, read from the collaborator-permission API and never inferred from the author name or from author_association
invariant|not-draft|the author, by marking the PR ready|a draft PR is unfinished by declaration and CI is not the author's signal to merge
invariant|no-hold-label|the author, by removing the label|a hold label is an explicit request for review on THIS pull request, and it is the per-PR review mechanism ADR-14 leaves in place now that the path list is a deny-list; the label set matches pr-merge-sweeper so one label holds a PR against both
invariant|no-deletions|Tainan (@taigfs)|a deletion or a rename removes a path that something live may read, and no guard in this repo renders a file that is gone; this invariant carries much more weight now that the path list is a deny-list
invariant|registry-no-metadata-loss|Tainan (@taigfs)|registry.json is served live by the studio MCP and four green guards do not see a lost when_to_use, avoid_when or tags, so no entry, no entry key and no top-level key may DISAPPEAR or be EMPTIED; a changed value is fine because it is visible in the diff (plan Gap 4, which update_template causes today)
invariant|new-template-dir-only|Tainan (@taigfs)|new-template only: if the diff introduces a templates/ directory that is not on the base commit, then it must touch exactly ONE template directory, that id must be the new one, and every one of its files must be status=added — otherwise a new template could dodge the two invariants below by also touching a second template
invariant|registry-single-append|Tainan (@taigfs)|new-template only: registry.json must gain exactly one templates[] entry, at the END of the array, whose id equals the new template id, with every pre-existing entry and every other top-level key unchanged
invariant|non-empty-sample-source|Tainan (@taigfs)|new-template only: a new template must ship a non-empty sample source, or every slot renders empty: either templates/<id>/sample.json holding at least one key, or at least one slot in templates/<id>/config.yaml carrying a sample: value; a config.yaml that declares ZERO slots is exempt, because a template with nothing to fill needs no sample (that is templates/blank/, which ships no sample.json on purpose)
invariant|guards-green|Tainan (@taigfs)|every `guard` line below must resolve to a successful job or step ON THE HEAD SHA, and no other check run on that SHA may be failing or still running

# ---------------------------------------------------------------------------
# guard — the blocking CI results, by display name. `<job>|<step or ->`.
#
# 🚨 A GREEN `Canvas fill + previews` JOB IS NOT EVIDENCE THAT THE PREVIEW
# RASTERS MATCH. Its "Check for preview drift" step emits `::warning::` and exits
# 0 on purpose, because CI fonts and Chromium differ from a local render. So a
# template whose PNG changed for a BAD reason still shows a green job. That is
# plan risk 8 and Verification criterion 2, still open, and it is NOT listed as a
# guard below because it cannot fail.
#
# ⚠️ THAT NOW MATTERS MORE THAN IT DID. The old gate was scoped to a NEW
# directory, which has no approved raster to drift from, so the soft drift step
# cost nothing. Under ADR-14 an EDIT to an existing template auto-merges, and
# its raster can change for a bad reason with every guard green. The fix is the
# three-step sequence in Verification criterion 2 — vendor the sample images,
# build the cross-engine diff, then flip the step to blocking — not a human gate.
#
# The two STEPS are named individually, not just their job, so that deleting or
# renaming a guard step fails closed instead of inheriting the job's green.
# ---------------------------------------------------------------------------
guard|Lint CSS scoping|-|the static CSS scoping / canvas / theme-token linter; it is what keeps a template's CSS from leaking out of .tpl-root into the host deck
guard|Auto-merge rule engine|-|this gate's own regression suite; if the rules do not hold, the gate does not decide
guard|Canvas fill + previews|Check canvas fill|npm run check:canvas — measures the real laid-out box of .tpl-root in both orientations, which the static lint cannot see
guard|Canvas fill + previews|Check theme conformance (every template × every theme)|npm run check:theme — renders every template over a hostile page colour and reads back computed styles, which is how a transparent .tpl-root is caught
