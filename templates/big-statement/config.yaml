id: big-statement
name: Big Statement
version: "1.1.0"
category: content
# Design canvases this template ships. Absent = [landscape, portrait]
# (scripts/canvas.config.json defaultCanvases). social-portrait is 1080x1350
# (4:5, Instagram portrait) and is OPT-IN — plan ADR-8.
canvases: [landscape, portrait, social-portrait]
slots:
  - name: statement
    type: text
    required: true
    description: "Single oversized centered statement — the slide's only message"
    sample: "AI won't replace developers — developers using AI will replace those who don't."
  - name: eyebrow
    type: text
    required: false
    description: "Optional small uppercase label above the statement"
    sample: "The thesis"
  - name: items
    type: items
    required: false
    description: |
      Optional follow-up lines under the statement, smaller, one per item.
      Each item has:
        text — the line
      Every line is a `step`: add the Steps reveal animation to bring them in
      one at a time. Leave empty for the classic single statement.
    sample:
      - text: "Learn the tools."
      - text: "Ship with them."
